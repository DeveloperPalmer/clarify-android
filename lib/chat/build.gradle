plugins {
    id 'android-library-convention'
    id 'dagger-convention'
}

android {
    namespace "ru.sla.clarify.chat"

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        ndk {
            abiFilters "arm64-v8a"
        }

        def chatSdkSecretKey = (System.getenv("CHAT_SDK_SECRET_KEY") ?: "")
            .replace("\\", "\\\\")
            .replace("\"", "\\\"")
        buildConfigField "String", "CHAT_SDK_SECRET_KEY", "\"${chatSdkSecretKey}\""
    }
}

dependencies {
    api libs.chat.sdk
    implementation project(":core:domain")
    implementation project(":auth-session:data")
}
