// plugins block in groovy script doesn't support using "alias(..)"
// see https://github.com/gradle/gradle/issues/15383#issuecomment-1396061277
// but outside of plugins block everything works ok
plugins {
  id "com.android.library"
  id "org.jetbrains.kotlin.android"
  id "org.gradle.android.cache-fix"
  id "io.gitlab.arturbosch.detekt"
  id "spotless-convention"
}

android {
  compileSdk = 37

  defaultConfig {
    minSdk 31
  }

  buildFeatures {
    aidl = false
    renderScript = false
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlin {
    jvmToolchain {
      languageVersion = JavaLanguageVersion.of(17)
    }
    compilerOptions {
      jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
      freeCompilerArgs.add("-jvm-default=no-compatibility")
      freeCompilerArgs.add("-opt-in=kotlinx.coroutines.FlowPreview")
      freeCompilerArgs.add("-opt-in=kotlin.contracts.ExperimentalContracts")
      freeCompilerArgs.add("-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi")
      freeCompilerArgs.add("-opt-in=kotlinx.serialization.ExperimentalSerializationApi")
    }
  }

  testOptions {
    unitTests.all {
      useJUnitPlatform()
      testLogging {
        events = ["failed", "skipped", "passed", "standard_out", "standard_error"]
        showExceptions true
        showStackTraces true
        showCauses true
        exceptionFormat "full"
      }
    }
  }
}

dependencies {
  detektPlugins(files(rootProject.file("libs/detekt-rules-1.2.0.jar")))
  detektPlugins(libs.detekt.rules.compose)
}

detekt {
  config = files(rootProject.file("detekt-config.yml"))
  ignoredBuildTypes = ["release"]
}

tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
  jvmTarget = "17"
  // "exclude(**/generated/**)" doesn't work for some reason, see
  // https://github.com/detekt/detekt/issues/4127#issuecomment-1260733842
  exclude {
    // Use separator to make sure it also works on Windows
    def sep = File.separator
    it.file.absolutePath.contains("${sep}generated${sep}")
  }
  reports {
    xml.required.set(false)
    html.required.set(false)
    txt.required.set(false)
    sarif.required.set(false)
  }
}

tasks.withType(io.gitlab.arturbosch.detekt.DetektCreateBaselineTask).configureEach {
  jvmTarget = "17"
}
