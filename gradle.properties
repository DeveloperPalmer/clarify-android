org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
kotlin.code.style=official

# Turning off unused features can spead up the build process
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.dataBinding=false
android.defaults.buildfeatures.shaders=false
android.nonTransitiveRClass=true
android.useAndroidX=true

# AGP built-in Kotlin (com.android.built-in-kotlin) bundles Kotlin 2.2.10, which skews against the
# project's Kotlin 2.4.10 and breaks the compose group mapping task (compose-group-mapping:2.2.10 is
# unpublished). Stay on the standalone org.jetbrains.kotlin.android plugin until a built-in-kotlin
# release bundles a matching Kotlin. This also disables the newer AGP Kotlin DSL that plugin needs.
android.builtInKotlin=false
android.newDsl=false

# Silence the deprecation of org.jetbrains.kotlin.android (kept intentionally, see above) and the
# way-gradle-plugin sourceSets access (KT-74451); drop once built-in Kotlin becomes viable.
kotlin.suppressGradlePluginWarnings=DeprecatedKotlinAndroidPlugin,SourceSetsAccessInAndroidExtension

org.gradle.parallel=true
org.gradle.caching=true

kotlin.incremental=false

# see https://developer.android.com/build/shrink-code#full-mode
android.enableR8.fullMode=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
