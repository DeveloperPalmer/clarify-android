org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
kotlin.code.style=official

# Turning off unused features can spead up the build process
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.dataBinding=false
android.defaults.buildfeatures.shaders=false
android.nonTransitiveRClass=true
android.useAndroidX=true

# Anvil KSP still reads AGP/KSP compatibility APIs that are disabled by AGP built-in Kotlin.
android.builtInKotlin=false
android.newDsl=false

# Silence the warning about deprecated 'org.jetbrains.kotlin.android' plugin usage
# while Anvil still requires the legacy Android Kotlin integration.
kotlin.suppressGradlePluginWarnings=DeprecatedKotlinAndroidPlugin

org.gradle.parallel=true
org.gradle.caching=true

kotlin.incremental=false

# see https://developer.android.com/build/shrink-code#full-mode
android.enableR8.fullMode=true
