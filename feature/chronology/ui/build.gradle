plugins {
  id 'android-library-convention'
  id 'android-compose-convention'
  id "kotlin-inject-convention"
}

android {
  namespace "ru.sla.clarify.feature.chronology.ui"
}

dependencies {
  // api — узлы и ветки полотна выходят наружу через ChronologyGraph и ViewState
  api project(":lib:atlas")
  // Панель под тоглом `chronologyDebugOverlay`: экран её показывает, но наружу она не выходит.
  implementation project(":lib:atlas-debug")
  implementation project(":uikit")
  implementation project(":feature:chronology:domain")

  implementation libs.androidx.activity.compose // for BackHandler

  testImplementation libs.bundles.unittest
  testRuntimeOnly libs.junit.jupiter.engine
  testRuntimeOnly libs.junit.platform.launcher
}
