plugins {
  id "kotlin-convention"
  alias(libs.plugins.openapi.generator)
  alias(libs.plugins.kotlinx.serialization)
}

dependencies {
  api libs.kotlinx.serialization.json

  testImplementation libs.junit.jupiter.api
  testRuntimeOnly libs.junit.jupiter.engine
  testRuntimeOnly libs.junit.platform.launcher
}

/**
 * Версия копии спеки уезжает в код константой: клиент предъявляет её серверу, и держать её
 * вторым, рукописным экземпляром нельзя — рукописный разойдётся с YAML на первом же обновлении
 * копии и разойдётся молча.
 */
def writeSpecVersion = tasks.register("writeSpecVersion") {
  def spec = layout.projectDirectory.file("clarify.yaml")
  def outputDir = layout.buildDirectory.dir("generated/version/kotlin")

  inputs.file(spec)
  outputs.dir(outputDir)

  doLast {
    def version = readInfoVersion(spec.asFile)
    def target = outputDir.get().file("ru/sla/clarify/openapi/SpecVersion.kt").asFile
    target.parentFile.mkdirs()
    target.text = """\
package ru.sla.clarify.openapi

/**
 * `info.version` копии спеки. Печатается сборкой из YAML — руками это значение не правится.
 */
const val SPEC_VERSION: String = "${version}"
"""
  }
}

sourceSets.main.kotlin.srcDir(writeSpecVersion)

/**
 * `info.version` — единственное поле, которое читается из YAML сборкой, и парсер ради него не
 * заводится: версия лежит на втором уровне под `info`, у которого нет одноимённых соседей.
 * Отсутствие поля — обрыв сборки, а не пустая константа: пустая уехала бы на сервер молча.
 */
static String readInfoVersion(File spec) {
  def inInfo = false
  for (String line : spec.readLines()) {
    if (line ==~ /^\S.*/) {
      inInfo = line.startsWith("info:")
      continue
    }
    def matcher = line =~ /^\s{2}version:\s*["']?([^"'\s]+)["']?\s*$/
    if (inInfo && matcher) {
      return matcher[0][1]
    }
  }
  throw new GradleException("clarify.yaml has no info.version")
}

/**
 * Прогон моделей. Указание `models` выключает всё остальное, поэтому `supportingFiles` не
 * порождаются вовсе и `openapi-generator-ignore` не нужен.
 *
 * Вывод пока не попадает в исходники модуля, и это не забывчивость. Шаблон по умолчанию печатает
 * родителя иерархии кадров обычным `interface`, а `@Serializable` без аргументов kotlinx принимает
 * только на `sealed` — компиляция падает на первом же кадре. Прогон включается в `srcDirs` вместе
 * со своим шаблоном, не раньше.
 */
openApiGenerate {
  generatorName = "kotlin"
  inputSpec = layout.projectDirectory.file("clarify.yaml").asFile.path
  outputDir = layout.buildDirectory.dir("generated/openapi").get().asFile.path
  packageName = "ru.sla.clarify.openapi"
  modelPackage = "ru.sla.clarify.openapi.model"
  globalProperties = [models: ""]
  configOptions = [
    serializationLibrary: "kotlinx_serialization",
    enumPropertyNaming: "UPPERCASE"
  ]
}
