[versions]
#core versions
agp = "8.11.1"
ksp = "2.2.21-2.0.4"
kotlin = "2.2.21"
kotlinx-coroutines = "1.7.3"
kotlinx-serialization-json = "1.5.1"
androidx-core = "1.10.1"
androidx-activity = "1.9.2"
androidx-annotation = "1.6.0"
compose = "1.6.8"
composeRuntime = "1.6.11"
okhttp = "4.11.0"
retrofit = "2.9.0"
#project versions
remo = "1.1.1"
amvi = "0.9.1"
way = "0.8.10"
dagger = "2.59.2"
anvil = "2.7.0"
material3 = "1.4.0"
#additional versions
ktlint = "0.46.0"
spotless = "6.18.0"
detekt = "1.23.0"
detekt-rules-compose = "1.3.0"
coil = "2.3.0"
cachefix = "3.0.3"
#chat versions
chat = "8.9.7511"
fairebaseBoom = "34.12.0"
google-services = "4.4.4"

[libraries]
kotlin-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlin-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }

javax-inject = { module = "javax.inject:javax.inject", version = "1" }
dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }

androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-annotations = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-util = { module = "androidx.compose.ui:ui-util", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeRuntime" }
compose-graphics = { module = "androidx.compose.animation:animation-graphics", version.ref = "compose" }
compose-compiler-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

coil-base = { module = "io.coil-kt:coil-base", version.ref = "coil" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

remo = { module = "ru.kode:remo", version.ref = "remo" }
amvi-compose = { module = "ru.kode:amvi-component-compose", version.ref = "amvi" }
amvi-viewmodel = { module = "ru.kode:amvi-viewmodel", version.ref = "amvi" }
way = { module = "ru.kode:way", version.ref = "way" }
way-compose = { module = "ru.kode:way-compose", version.ref = "way" }

chat-sdk = { module = "com.tencent.imsdk:imsdk-plus", version.ref = "chat" }

firebase-boom = { module = "com.google.firebase:firebase-bom", version.ref = "fairebaseBoom" }

detekt-rules-compose = { module = "ru.kode:detekt-rules-compose", version.ref = "detekt-rules-compose" }
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
anvil-plugin = { module = "com.squareup.anvil:gradle-plugin", version.ref = "anvil" }
kotlin-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
detekt-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
cachefix-plugin = { module = "org.gradle.android.cache-fix:org.gradle.android.cache-fix.gradle.plugin", version.ref = "cachefix" }
ksp-plugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }

[bundles]
core = [
    "kotlin-coroutines-core",
    "kotlin-coroutines-android",
    "javax-inject",
]

android-core = [
    "androidx-annotations",
    "androidx-core",
]

android-ui = [
    "compose-ui",
    "compose-ui-util",
    "compose-material3",
    "compose-tooling",
    "compose-runtime",
    "compose-graphics",
    "coil-base",
    "coil-compose",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
cachefix = { id = "org.gradle.android.cache-fix", version.ref = "cachefix" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
way = { id = "ru.kode.way", version.ref = "way" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }