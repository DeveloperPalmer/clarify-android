name: validation
on: push
jobs:
  validation:
    runs-on: ubuntu-24.04 # метку закрепляем явно, см. «Ловушки»
    steps:
      - run: |
          java -version
          echo "--- JDKs ---" && ls /usr/lib/jvm
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "--- Platforms ---" && ls $ANDROID_HOME/platforms
          echo "--- Build Tools ---" && ls $ANDROID_HOME/build-tools
          echo "CPUs: $(nproc)"
          echo "--- Memory ---" && free -h
          echo "--- Disk ---" && df -h /
          gradle -v