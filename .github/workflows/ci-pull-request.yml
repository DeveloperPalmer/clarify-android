name: validation
on:
  pull_request:
    branches: [ dev ]
jobs:
  validation:
    name: Validation job
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew prePushCheck
      - run: ./gradlew assembleDebug
    timeout-minutes: 30

  test:
    name: Should run tests
    runs-on: ubuntu-24.04
    needs: [validation]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test
    timeout-minutes: 30
